<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给曾曦玥的生日祝福</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
}

/* 背景渐变 - 天空 */
#sky {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #87CEEB 0%, #98d5ef 40%, #b8e2f2 70%, #d4f1f9 100%);
  transition: background 3s ease;
  z-index: 0;
}

/* 阳光 */
#sun {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, #FFF6A0 0%, #FFE066 40%, #FFC93C 70%, #FF9F1C 100%);
  box-shadow: 0 0 60px rgba(255, 201, 60, 0.7), 0 0 120px rgba(255, 201, 60, 0.4), 0 0 200px rgba(255, 201, 60, 0.2);
  animation: sunPulse 4s ease-in-out infinite;
  z-index: 2;
}

@keyframes sunPulse {
  0%, 100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 60px rgba(255, 201, 60, 0.7), 0 0 120px rgba(255, 201, 60, 0.4), 0 0 200px rgba(255, 201, 60, 0.2); }
  50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 80px rgba(255, 201, 60, 0.9), 0 0 150px rgba(255, 201, 60, 0.5), 0 0 250px rgba(255, 201, 60, 0.3); }
}

/* 太阳光线 */
.sun-ray {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2px;
  height: 200px;
  transform-origin: top center;
  background: linear-gradient(180deg, rgba(255, 201, 60, 0.5), transparent);
  animation: rayRotate 20s linear infinite;
  z-index: 1;
}

@keyframes rayRotate {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* 云朵 */
.cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 50px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  animation: cloudFloat linear infinite;
  z-index: 3;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 50%;
}

@keyframes cloudFloat {
  from { transform: translateX(-200px); }
  to { transform: translateX(calc(100vw + 200px)); }
}

/* 雨滴 */
.rain {
  position: absolute;
  width: 2px;
  height: 20px;
  background: linear-gradient(180deg, rgba(100,150,200,0), rgba(100,150,200,0.6));
  border-radius: 0 0 2px 2px;
  animation: rainFall linear infinite;
  z-index: 4;
}

@keyframes rainFall {
  from { transform: translateY(-100px); opacity: 1; }
  to { transform: translateY(100vh); opacity: 0; }
}

/* 伞 */
#umbrella {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 100px;
  z-index: 5;
  animation: umbrellaFloat 3s ease-in-out infinite;
}

@keyframes umbrellaFloat {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-10px); }
}

.umbrella-top {
  position: absolute;
  top: 0;
  left: 0;
  width: 140px;
  height: 70px;
  background: linear-gradient(135deg, #FF6B6B 0%, #EE5A5A 50%, #C0392B 100%);
  border-radius: 70px 70px 0 0;
  box-shadow: inset -10px 0 20px rgba(0,0,0,0.15);
  overflow: hidden;
}
.umbrella-top::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(90deg, transparent 0, transparent 30px, rgba(255,255,255,0.15) 30px, rgba(255,255,255,0.15) 32px);
}
.umbrella-rib {
  position: absolute;
  top: 70px;
  width: 2px;
  height: 8px;
  background: #8B4513;
}
.umbrella-rib-1 { left: 0; }
.umbrella-rib-2 { left: 49px; }
.umbrella-rib-3 { left: 90px; }
.umbrella-rib-4 { left: 138px; }
.umbrella-stick {
  position: absolute;
  top: 70px;
  left: 68px;
  width: 4px;
  height: 35px;
  background: #8B4513;
  border-radius: 0 0 2px 2px;
}
.umbrella-handle {
  position: absolute;
  top: 105px;
  left: 68px;
  width: 20px;
  height: 15px;
  border: 4px solid #8B4513;
  border-top: none;
  border-radius: 0 0 10px 10px;
}

/* 地面 */
#ground {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 15%;
  background: linear-gradient(180deg, #7CC683 0%, #5BA55F 50%, #3D8B40 100%);
  z-index: 4;
}
.grass-blade {
  position: absolute;
  bottom: 0;
  width: 3px;
  height: 20px;
  background: linear-gradient(180deg, #4CAF50, #2E7D32);
  border-radius: 2px 2px 0 0;
  transform-origin: bottom center;
  animation: grassSway 2s ease-in-out infinite;
}
@keyframes grassSway {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

/* 小花 */
.flower {
  position: absolute;
  bottom: 5%;
  width: 20px;
  height: 20px;
  z-index: 5;
}
.flower-petal {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  top: 6px;
  left: 6px;
}
.flower-center {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #FFC107;
  top: 7px;
  left: 7px;
  z-index: 2;
}

/* 蝴蝶 */
.butterfly {
  position: absolute;
  z-index: 6;
  animation: butterflyFly 8s ease-in-out infinite;
}
.butterfly-wing {
  position: absolute;
  width: 15px;
  height: 20px;
  border-radius: 50% 50% 50% 0;
  animation: wingFlap 0.3s ease-in-out infinite;
}
.butterfly-wing-left {
  right: 8px;
  transform-origin: right center;
  background: linear-gradient(135deg, #FF9F1C, #FFC93C);
}
.butterfly-wing-right {
  left: 8px;
  transform-origin: left center;
  background: linear-gradient(45deg, #FF9F1C, #FFC93C);
  border-radius: 50% 50% 0 50%;
  animation-delay: 0.15s;
}
@keyframes wingFlap {
  0%, 100% { transform: rotateY(0deg) rotateZ(-5deg); }
  50% { transform: rotateY(60deg) rotateZ(-5deg); }
}
@keyframes butterflyFly {
  0% { transform: translate(20vw, 40vh); }
  25% { transform: translate(60vw, 30vh); }
  50% { transform: translate(70vw, 50vh); }
  75% { transform: translate(40vw, 60vh); }
  100% { transform: translate(20vw, 40vh); }
}

/* 主内容区 */
#content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  width: 90%;
  max-width: 500px;
}

#blessing-card {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-radius: 30px;
  padding: 40px 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.5) inset;
  border: 1px solid rgba(255,255,255,0.6);
  animation: cardAppear 1.5s ease-out;
}

@keyframes cardAppear {
  from { opacity: 0; transform: scale(0.8) translateY(30px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.name-title {
  font-size: 42px;
  font-weight: 800;
  background: linear-gradient(135deg, #FF6B6B, #FF9F1C, #FFC93C);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: 2px;
  text-shadow: 0 2px 10px rgba(255, 159, 28, 0.3);
}

.birthday-text {
  font-size: 22px;
  color: #FF6B6B;
  font-weight: 600;
  margin-bottom: 20px;
  letter-spacing: 3px;
}

.blessing-msg {
  font-size: 16px;
  color: #555;
  line-height: 1.9;
  margin-bottom: 25px;
  padding: 0 10px;
}

.blessing-msg .highlight {
  color: #FF9F1C;
  font-weight: 600;
}

.blessing-msg .icon {
  font-size: 18px;
}

.from-sign {
  font-size: 14px;
  color: #999;
  font-style: italic;
  margin-top: 15px;
}

/* 飘落的祝福气泡 */
.wish-bubble {
  position: absolute;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  color: #FF6B6B;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  animation: bubbleFloat 6s ease-in-out infinite;
  white-space: nowrap;
  z-index: 8;
}

@keyframes bubbleFloat {
  0%, 100% { transform: translateY(0); opacity: 0.9; }
  50% { transform: translateY(-20px); opacity: 1; }
}

/* 装饰星星 */
.star {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #FFC93C;
  border-radius: 50%;
  animation: starTwinkle 2s ease-in-out infinite;
  z-index: 1;
}

@keyframes starTwinkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* 按钮 */
#play-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  border: none;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: all 0.3s;
}
#play-btn:hover {
  transform: scale(1.1);
  background: #fff;
}

/* 移动端优化 */
@media (max-width: 480px) {
  #sun { width: 90px; height: 90px; top: 6%; }
  .name-title { font-size: 32px; }
  .birthday-text { font-size: 18px; }
  .blessing-msg { font-size: 15px; }
  #umbrella { width: 100px; height: 75px; bottom: 18%; }
  .umbrella-top { width: 100px; height: 55px; }
}

/* 隐藏滚动 */
::-webkit-scrollbar { display: none; }

</style>
</head>
<body>

<div id="sky"></div>

<!-- 太阳 -->
<div id="sun"></div>

<!-- 云朵 -->
<div class="cloud" id="cloud1" style="top: 10%; width: 80px; height: 30px; animation-duration: 35s;"></div>
<div class="cloud" id="cloud2" style="top: 18%; width: 60px; height: 24px; animation-duration: 45s; animation-delay: -10s;"></div>
<div class="cloud" id="cloud3" style="top: 8%; width: 50px; height: 20px; animation-duration: 50s; animation-delay: -20s;"></div>

<!-- 伞 -->
<div id="umbrella">
  <div class="umbrella-top"></div>
  <div class="umbrella-rib umbrella-rib-1"></div>
  <div class="umbrella-rib umbrella-rib-2"></div>
  <div class="umbrella-rib umbrella-rib-3"></div>
  <div class="umbrella-rib umbrella-rib-4"></div>
  <div class="umbrella-stick"></div>
  <div class="umbrella-handle"></div>
</div>

<!-- 地面 -->
<div id="ground"></div>

<!-- 蝴蝶 -->
<div class="butterfly" id="butterfly1">
  <div class="butterfly-wing butterfly-wing-left"></div>
  <div class="butterfly-wing butterfly-wing-right"></div>
</div>

<!-- 主内容 -->
<div id="content">
  <div id="blessing-card">
    <div class="name-title">曾曦玥</div>
    <div class="birthday-text">🎂 生日快乐 🎂</div>
    <div class="blessing-msg">
      <div>🌈 从<span class="highlight">湖北</span>到<span class="highlight">福建</span>，跨越千里山水</div>
      <div>🌞 愿你的每一天都沐浴在<span class="highlight">阳光下</span></div>
      <div>☀️ 烈日当空，有人为你撑起阴凉</div>
      <div>🌧️ 骤雨突至，始终有<span class="highlight">伞</span>的庇护</div>
      <div>💪 无论晴天雨天，路上总有温柔相伴</div>
      <div style="margin-top:10px;">✨ 岁岁平安，年年如意 ✨</div>
    </div>
    <div class="from-sign">— 生日快乐 —</div>
  </div>
</div>

<button id="play-btn" onclick="toggleRain()">🌧️</button>

<script>
// 生成太阳光线
function createSunRays() {
  const sun = document.getElementById('sun');
  const container = sun.parentElement;
  const sunRect = sun.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const ray = document.createElement('div');
    ray.className = 'sun-ray';
    ray.style.top = (sunRect.top + sunRect.height/2) + 'px';
    ray.style.left = (sunRect.left + sunRect.width/2) + 'px';
    ray.style.transform = `rotate(${i * 30}deg) translateY(${-sunRect.width/2 - 10}px)`;
    ray.style.height = '100px';
    container.appendChild(ray);
  }
}

// 生成草地
function createGrass() {
  const ground = document.getElementById('ground');
  for (let i = 0; i < 50; i++) {
    const grass = document.createElement('div');
    grass.className = 'grass-blade';
    grass.style.left = (Math.random() * 100) + '%';
    grass.style.height = (10 + Math.random() * 20) + 'px';
    grass.style.animationDelay = (Math.random() * 2) + 's';
    grass.style.opacity = 0.6 + Math.random() * 0.4;
    ground.appendChild(grass);
  }
}

// 生成花朵
function createFlowers() {
  const colors = ['#FF6B6B', '#FFC93C', '#FF9F1C', '#E91E63', '#9C27B0'];
  const container = document.getElementById('ground');
  for (let i = 0; i < 8; i++) {
    const flower = document.createElement('div');
    flower.className = 'flower';
    flower.style.left = (5 + Math.random() * 90) + '%';
    flower.style.bottom = (0 + Math.random() * 30) + 'px';
    const color = colors[Math.floor(Math.random() * colors.length)];
    let petalsHTML = '';
    for (let j = 0; j < 5; j++) {
      const angle = (j * 72) * Math.PI / 180;
      const px = 10 + Math.cos(angle) * 6;
      const py = 10 + Math.sin(angle) * 6;
      petalsHTML += `<div class="flower-petal" style="top:${py}px; left:${px-4}px; background:${color}"></div>`;
    }
    flower.innerHTML = petalsHTML + '<div class="flower-center"></div>';
    container.appendChild(flower);
  }
}

// 生成星星装饰
function createStars() {
  for (let i = 0; i < 20; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = (Math.random() * 100) + '%';
    star.style.top = (Math.random() * 40) + '%';
    star.style.animationDelay = (Math.random() * 2) + 's';
    star.style.width = (3 + Math.random() * 5) + 'px';
    star.style.height = star.style.width;
    document.body.appendChild(star);
  }
}

// 生成雨滴
let rainActive = false;
function createRain() {
  const existingRain = document.querySelectorAll('.rain');
  existingRain.forEach(r => r.remove());
  if (rainActive) return;
  rainActive = true;
  for (let i = 0; i < 40; i++) {
    const rain = document.createElement('div');
    rain.className = 'rain';
    rain.style.left = (Math.random() * 100) + '%';
    rain.style.animationDuration = (0.4 + Math.random() * 0.4) + 's';
    rain.style.animationDelay = (Math.random() * 1) + 's';
    rain.style.height = (15 + Math.random() * 15) + 'px';
    document.body.appendChild(rain);
  }
}

function toggleRain() {
  rainActive = !rainActive;
  if (rainActive) {
    createRain();
    document.getElementById('play-btn').textContent = '☀️';
  } else {
    document.querySelectorAll('.rain').forEach(r => r.remove());
    document.getElementById('play-btn').textContent = '🌧️';
  }
}

// 飘落的祝福气泡
const wishes = ['生日快乐', '万事如意', '平安喜乐', '前程似锦', '心想事成', '笑口常开'];
function createWishBubbles() {
  wishes.forEach((wish, i) => {
    const bubble = document.createElement('div');
    bubble.className = 'wish-bubble';
    bubble.textContent = wish;
    bubble.style.left = (10 + Math.random() * 70) + '%';
    bubble.style.top = (5 + Math.random() * 20) + '%';
    bubble.style.animationDelay = (i * 0.5) + 's';
    document.body.appendChild(bubble);
  });
}

// 初始化
window.addEventListener('load', () => {
  createSunRays();
  createGrass();
  createFlowers();
  createStars();
  createWishBubbles();
  setTimeout(() => toggleRain(), 3000);
});
</script>

</body>
</html>
