<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 曾曦玥 · Birthday Protocol</title>
<style>
:root {
  --neon-cyan: #00f0ff;
  --neon-magenta: #ff00aa;
  --neon-purple: #aa00ff;
  --neon-blue: #0088ff;
  --neon-gold: #ffd700;
  --neon-green: #00ff88;
  --bg-dark: #0a0a1a;
  --bg-darker: #050510;
  --grid-color: rgba(0, 240, 255, 0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-darker);
  font-family: 'Orbitron', 'PingFang SC', 'Microsoft YaHei', monospace;
  color: #fff;
}

/* === 背景层 === */
#bg-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

/* 透视网格地面 */
.grid-floor {
  position: fixed; bottom: 0; left: 0;
  width: 100%; height: 45%;
  background: 
    linear-gradient(0deg, rgba(0,240,255,0.08) 0%, transparent 60%),
    linear-gradient(90deg, transparent 49.7%, var(--grid-color) 49.7%, var(--grid-color) 50.3%, transparent 50.3%) 0 0/40px 40px,
    linear-gradient(0deg, transparent 49.7%, var(--grid-color) 49.7%, var(--grid-color) 50.3%, transparent 50.3%) 0 0/40px 40px;
  transform: perspective(400px) rotateX(55deg);
  transform-origin: bottom center;
  z-index: 2;
  opacity: 0.6;
}

/* 扫描线 */
.scanline {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0, 240, 255, 0.015) 2px, rgba(0, 240, 255, 0.015) 4px
  );
  z-index: 10;
  pointer-events: none;
}

/* 中央光晕 */
.center-glow {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(170,0,255,0.08) 30%, transparent 70%);
  filter: blur(40px);
  z-index: 3;
  animation: glowPulse 5s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}

/* === HUD 边框装饰 === */
.hud-corner {
  position: fixed;
  width: 60px; height: 60px;
  z-index: 20;
  pointer-events: none;
}
.hud-corner::before, .hud-corner::after {
  content: '';
  position: absolute;
  background: var(--neon-cyan);
  box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0,240,255,0.5);
}
.hud-tl { top: 15px; left: 15px; }
.hud-tl::before { top: 0; left: 0; width: 30px; height: 2px; }
.hud-tl::after { top: 0; left: 0; width: 2px; height: 30px; }
.hud-tr { top: 15px; right: 15px; }
.hud-tr::before { top: 0; right: 0; width: 30px; height: 2px; }
.hud-tr::after { top: 0; right: 0; width: 2px; height: 30px; }
.hud-bl { bottom: 15px; left: 15px; }
.hud-bl::before { bottom: 0; left: 0; width: 30px; height: 2px; }
.hud-bl::after { bottom: 0; left: 0; width: 2px; height: 30px; }
.hud-br { bottom: 15px; right: 15px; }
.hud-br::before { bottom: 0; right: 0; width: 30px; height: 2px; }
.hud-br::after { bottom: 0; right: 0; width: 2px; height: 30px; }

/* === 加载序列 === */
#loading-screen {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--bg-darker);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1s ease;
}
#loading-screen.hide {
  opacity: 0;
  pointer-events: none;
}
.loading-text {
  font-family: 'Courier New', monospace;
  color: var(--neon-cyan);
  font-size: 14px;
  line-height: 2;
  text-align: left;
  min-height: 300px;
}
.loading-text .line {
  opacity: 0;
  animation: typeLine 0.3s ease forwards;
}
.loading-text .line:nth-child(1) { animation-delay: 0.2s; }
.loading-text .line:nth-child(2) { animation-delay: 0.5s; }
.loading-text .line:nth-child(3) { animation-delay: 0.8s; }
.loading-text .line:nth-child(4) { animation-delay: 1.1s; }
.loading-text .line:nth-child(5) { animation-delay: 1.4s; }
.loading-text .line:nth-child(6) { animation-delay: 1.7s; }
.loading-text .line:nth-child(7) { animation-delay: 2.0s; }
.loading-text .line:nth-child(8) { animation-delay: 2.3s; }
.loading-text .line:nth-child(9) { animation-delay: 2.6s; }
@keyframes typeLine {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.loading-bar {
  width: 300px; height: 3px;
  background: rgba(0,240,255,0.1);
  margin-top: 30px;
  border-radius: 2px;
  overflow: hidden;
}
.loading-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
  box-shadow: 0 0 10px var(--neon-cyan);
  width: 0%;
  animation: loadFill 2.8s ease forwards;
}
@keyframes loadFill {
  0% { width: 0%; }
  30% { width: 45%; }
  60% { width: 72%; }
  100% { width: 100%; }
}
.loading-title {
  font-size: 12px;
  color: rgba(0,240,255,0.5);
  margin-bottom: 20px;
  letter-spacing: 4px;
}

/* === 主内容 === */
#main-content {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  opacity: 0;
  transition: opacity 1.5s ease;
}
#main-content.show { opacity: 1; }

/* 全息卡片 */
.holo-card {
  position: relative;
  width: 92%;
  max-width: 520px;
  padding: 50px 40px 45px;
  background: linear-gradient(135deg, rgba(10,10,30,0.85), rgba(20,10,40,0.85));
  border: 1px solid rgba(0,240,255,0.3);
  border-radius: 4px;
  box-shadow: 
    0 0 30px rgba(0,240,255,0.15),
    0 0 60px rgba(170,0,255,0.1),
    inset 0 0 30px rgba(0,240,255,0.05);
  backdrop-filter: blur(10px);
  overflow: hidden;
}
.holo-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,240,255,0.15), transparent);
  animation: cardSweep 4s ease-in-out infinite;
}
@keyframes cardSweep {
  0%, 100% { left: -100%; }
  50% { left: 100%; }
}
.holo-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: 1px solid transparent;
  background: linear-gradient(135deg, var(--neon-cyan), transparent, var(--neon-magenta)) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* 卡片顶部 HUD 条 */
.card-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  color: rgba(0,240,255,0.5);
  letter-spacing: 2px;
}
.card-hud .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 6px var(--neon-green);
  margin-right: 6px;
  animation: dotBlink 2s ease-in-out infinite;
}
@keyframes dotBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* 名字 */
.name-glow {
  font-size: 52px;
  font-weight: 900;
  text-align: center;
  letter-spacing: 6px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-magenta));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(0,240,255,0.5));
  margin-bottom: 5px;
  animation: nameFlicker 8s ease-in-out infinite;
}
@keyframes nameFlicker {
  0%, 95%, 100% { opacity: 1; }
  96% { opacity: 0.5; }
  97% { opacity: 1; }
  98% { opacity: 0.3; }
}

.name-en {
  text-align: center;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: rgba(0,240,255,0.4);
  letter-spacing: 8px;
  margin-bottom: 25px;
}

/* 生日标记 */
.birthday-badge {
  display: inline-block;
  margin: 0 auto 25px;
  padding: 8px 30px;
  border: 1px solid rgba(0,240,255,0.4);
  border-radius: 30px;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  color: var(--neon-cyan);
  letter-spacing: 4px;
  background: rgba(0,240,255,0.05);
  box-shadow: 0 0 15px rgba(0,240,255,0.2), inset 0 0 15px rgba(0,240,255,0.05);
  animation: badgePulse 3s ease-in-out infinite;
}
@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 15px rgba(0,240,255,0.2), inset 0 0 15px rgba(0,240,255,0.05); }
  50% { box-shadow: 0 0 25px rgba(0,240,255,0.4), inset 0 0 20px rgba(0,240,255,0.1); }
}

/* 分隔线 */
.divider {
  width: 60%;
  height: 1px;
  margin: 0 auto 25px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  position: relative;
}
.divider::after {
  content: '◆';
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: var(--neon-cyan);
  text-shadow: 0 0 10px var(--neon-cyan);
}

/* 祝福语 */
.blessing-lines {
  text-align: center;
  margin-bottom: 25px;
}
.blessing-line {
  font-size: 15px;
  color: rgba(255,255,255,0.8);
  line-height: 2.2;
  letter-spacing: 1px;
  opacity: 0;
  transform: translateY(10px);
  animation: lineFadeIn 0.8s ease forwards;
}
.blessing-line:nth-child(1) { animation-delay: 0.5s; }
.blessing-line:nth-child(2) { animation-delay: 0.8s; }
.blessing-line:nth-child(3) { animation-delay: 1.1s; }
.blessing-line:nth-child(4) { animation-delay: 1.4s; }
.blessing-line:nth-child(5) { animation-delay: 1.7s; }
@keyframes lineFadeIn {
  to { opacity: 1; transform: translateY(0); }
}
.hl-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5); font-weight: 700; }
.hl-magenta { color: var(--neon-magenta); text-shadow: 0 0 10px rgba(255,0,170,0.5); font-weight: 700; }
.hl-gold { color: var(--neon-gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); font-weight: 700; }
.hl-green { color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,136,0.5); font-weight: 700; }

/* 签名 */
.signature {
  text-align: center;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 3px;
  margin-top: 20px;
}
.signature .heart {
  color: var(--neon-magenta);
  animation: heartBeat 1.5s ease-in-out infinite;
}
@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* === 侧边数据流 === */
.data-stream {
  position: fixed;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  color: rgba(0,240,255,0.2);
  line-height: 1.6;
  z-index: 15;
  pointer-events: none;
  overflow: hidden;
}
.data-stream-left { left: 20px; top: 80px; height: calc(100vh - 160px); width: 120px; }
.data-stream-right { right: 20px; top: 80px; height: calc(100vh - 160px); width: 120px; text-align: right; }
.data-stream .item {
  opacity: 0;
  animation: streamFade 8s linear infinite;
}
@keyframes streamFade {
  0% { opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { opacity: 0; }
}

/* === 浮动粒子 === */
.floating-particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 12;
  animation: particleFloat linear infinite;
}
@keyframes particleFloat {
  from { transform: translateY(100vh) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  to { transform: translateY(-100px) translateX(var(--drift, 20px)); opacity: 0; }
}

/* 按钮 */
#toggle-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 50px; height: 50px;
  border-radius: 50%;
  background: rgba(10,10,30,0.8);
  border: 1px solid rgba(0,240,255,0.4);
  color: var(--neon-cyan);
  font-size: 22px;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 0 15px rgba(0,240,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(5px);
}
#toggle-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px rgba(0,240,255,0.5);
  background: rgba(0,240,255,0.1);
}

/* 角落标签 */
.corner-label {
  position: fixed;
  font-family: 'Courier New', monospace;
  font-size: 9px;
  color: rgba(0,240,255,0.3);
  letter-spacing: 2px;
  z-index: 20;
  pointer-events: none;
}
.cl-top { top: 20px; left: 50%; transform: translateX(-50%); }
.cl-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }

/* 移动端 */
@media (max-width: 480px) {
  .holo-card { padding: 35px 25px; width: 94%; }
  .name-glow { font-size: 38px; letter-spacing: 4px; }
  .data-stream { display: none; }
  .hud-corner { width: 35px; height: 35px; }
  .blessing-line { font-size: 14px; line-height: 2; }
  .birthday-badge { font-size: 14px; padding: 6px 20px; }
}

::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- 背景粒子 Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- 网格地面 -->
<div class="grid-floor"></div>

<!-- 扫描线 -->
<div class="scanline"></div>

<!-- 中央光晕 -->
<div class="center-glow"></div>

<!-- HUD 边框 -->
<div class="hud-corner hud-tl"></div>
<div class="hud-corner hud-tr"></div>
<div class="hud-corner hud-bl"></div>
<div class="hud-corner hud-br"></div>

<!-- 角落标签 -->
<div class="corner-label cl-top">⬢ BIRTHDAY PROTOCOL v2.0 ⬢</div>
<div class="corner-label cl-bottom">⬢ ZENG XIYUE · 2026 ⬢</div>

<!-- 左侧数据流 -->
<div class="data-stream data-stream-left" id="stream-left"></div>

<!-- 右侧数据流 -->
<div class="data-stream data-stream-right" id="stream-right"></div>

<!-- 浮动粒子 -->
<div id="particles"></div>

<!-- 加载序列 -->
<div id="loading-screen">
  <div class="loading-title">⬢ SYSTEM BOOT ⬢</div>
  <div class="loading-text" id="boot-text"></div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<!-- 主内容 -->
<div id="main-content">
  <div class="holo-card">
    <!-- 卡片顶部 HUD -->
    <div class="card-hud">
      <span><span class="dot"></span>STATUS: ONLINE</span>
      <span>SYS://BIRTHDAY_2026</span>
    </div>

    <!-- 名字 -->
    <div class="name-glow">曾曦玥</div>
    <div class="name-en">Z E N G &nbsp; X I &nbsp; Y U E</div>

    <!-- 生日标记 -->
    <div class="birthday-badge">⬢ HAPPY BIRTHDAY ⬢</div>

    <!-- 分隔线 -->
    <div class="divider"></div>

    <!-- 祝福语 -->
    <div class="blessing-lines">
      <div class="blessing-line">🌊 从 <span class="hl-cyan">湖北</span> 到 <span class="hl-magenta">福建</span>，跨越千里山河</div>
      <div class="blessing-line">☀️ 愿你的每一天，都沐浴在 <span class="hl-gold">阳光</span> 之下</div>
      <div class="blessing-line">🔥 烈日当空，有人为你撑起 <span class="hl-green">清凉</span></div>
      <div class="blessing-line">☔ 骤雨突至，始终有 <span class="hl-cyan">伞</span> 的庇护</div>
      <div class="blessing-line">⬢ 无论晴雨，路上总有 <span class="hl-magenta">温柔</span> 相伴 ⬢</div>
    </div>

    <!-- 签名 -->
    <div class="signature">
      ─── ⬢ <span class="heart">♥</span> ⬢ 岁岁平安 · 年年如意 ⬢ ───
    </div>
  </div>
</div>

<!-- 切换按钮 -->
<button id="toggle-btn" onclick="toggleEffect()">⬢</button>

<script>
// === 启动序列 ===
const bootLines = [
  '> INITIALIZING BIRTHDAY PROTOCOL...',
  '> CONNECTING TO REMOTE SERVER [HUBEI → FUJIAN]...',
  '> DECRYPTING BLESSING DATA... OK',
  '> LOADING PARTICLE ENGINE... OK',
  '> CALIBRATING HOLOGRAPHIC DISPLAY... OK',
  '> INJECTING SUNBEAM MODULE... OK',
  '> DEPLOYING UMBRELLA PROTECTION... OK',
  '> ALL SYSTEMS NOMINAL',
  '> WELCOME, ZENG XIYUE ⬢'
];

const bootText = document.getElementById('boot-text');
bootLines.forEach((line, i) => {
  const div = document.createElement('div');
  div.className = 'line';
  div.style.animationDelay = (0.2 + i * 0.3) + 's';
  div.textContent = line;
  bootText.appendChild(div);
});

// 加载完成后显示主内容
setTimeout(() => {
  document.getElementById('loading-screen').classList.add('hide');
  setTimeout(() => {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-content').classList.add('show');
  }, 1000);
}, 3200);

// === 粒子背景 Canvas ===
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouseX = 0, mouseY = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.hue = Math.random() > 0.5 ? 180 : 300;
    this.pulse = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.pulse += 0.02;
    
    // Mouse attraction
    const dx = mouseX - this.x;
    const dy = mouseY - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 200) {
      this.x += dx * 0.002;
      this.y += dy * 0.002;
    }
    
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
  }
  draw() {
    const o = this.opacity * (0.5 + Math.sin(this.pulse) * 0.5);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${o})`;
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${o * 0.1})`;
    ctx.fill();
  }
}

// Create particles
for (let i = 0; i < 150; i++) {
  particles.push(new Particle());
}

// Connection lines
function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 120) {
        const o = (1 - dist / 120) * 0.15;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0, 240, 255, ${o})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Gradient background
  const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
  grad.addColorStop(0, '#0a0a2a');
  grad.addColorStop(0.5, '#080818');
  grad.addColorStop(1, '#050510');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => { p.update(); p.draw(); });
  drawConnections();
  
  requestAnimationFrame(animate);
}
animate();

];

function fillStream(el, count) {
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = dataItems[Math.floor(Math.random() * dataItems.length)];
    div.style.animationDelay = (i * 0.8 + Math.random() * 2) + 's';
    el.appendChild(div);
  }
}
fillStream(document.getElementById('stream-left'), 25);
fillStream(document.getElementById('stream-right'), 25);

// === 浮动粒子 ===
function createFloatingParticles() {
  const container = document.getElementById('particles');
  const colors = ['0,240,255', '170,0,255', '255,0,170', '0,255,136'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'floating-particle';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 2 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = `rgba(${color}, 0.8)`;
    p.style.boxShadow = `0 0 10px rgba(${color}, 0.6)`;
    p.style.animationDuration = (5 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
    container.appendChild(p);
  }
}
createFloatingParticles();

// === 切换效果 ===
let effectActive = true;
function toggleEffect() {
  effectActive = !effectActive;
  document.querySelectorAll('.floating-particle').forEach(p => {
    p.style.display = effectActive ? '' : 'none';
  });
  document.querySelectorAll('.data-stream .item').forEach(p => {
    p.style.display = effectActive ? '' : 'none';
  });
  const btn = document.getElementById('toggle-btn');
  btn.textContent = effectActive ? '⬢' : '⊘';
  btn.style.borderColor = effectActive ? 'rgba(0,240,255,0.4)' : 'rgba(255,0,170,0.4)';
  btn.style.color = effectActive ? 'var(--neon-cyan)' : 'var(--neon-magenta)';
}
